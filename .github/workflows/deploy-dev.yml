name: Deploy DEV (S3 + CloudFront)

# ============================================================================
# Sitio Wapi → DEV en S3 + CloudFront (mismo esquema que el DEV de WG013).
# Se dispara con cada push a `develop`. Siempre buildea el SITIO NUEVO (flag encendido)
# para poder revisarlo online mientras producción sigue con la página "en desarrollo".
# DEV va con noindex y robots.txt que bloquea todo: no aparece en buscadores.
#
# Auth por OIDC (sin access keys): el rol html-wapi-frontend-github-deploy solo lo puede
# asumir este repo desde la rama develop, y solo escribe en el bucket de DEV.
#
# Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION                       us-east-1
#   AWS_ROLE_TO_ASSUME               arn:aws:iam::004878717556:role/html-wapi-frontend-github-deploy
#   S3_BUCKET_DEV                    html-wapi-dev-frontend-east
#   CLOUDFRONT_DISTRIBUTION_ID_DEV   ELR7ZX18EE9BP
#   SITE_URL_DEV                     https://d1rinjgyxivyfh.cloudfront.net
# ============================================================================

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # npm ci: instala exactamente lo del lockfile (que ya trae los binarios de Linux de
      # lightningcss, @tailwindcss/oxide y rolldown). Sin lockfile, cada build traía la última
      # versión de cada dependencia, revisada o no (docs/Seguridad.md S3).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (sitio nuevo, noindex)
        # Las variables del proceso pisan a .env.production.
        env:
          VITE_SITIO_NUEVO: 'true'
          VITE_NOINDEX: 'true'
          VITE_SITE_URL: ${{ vars.SITE_URL_DEV }}
        run: npm run build

      # Lo que el build carga tiene que entrar en la CSP que manda CloudFront (scripts/headers-seguridad.sh).
      - name: El build entra en la CSP
        run: node scripts/verificar-csp.mjs

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # El bucket tiene un marker `.project-owner` = "html-wapi". Si no coincide, aborta:
      # evita pisar el bucket de otro proyecto por una variable mal cargada.
      - name: Validar ownership del bucket
        env:
          BUCKET: ${{ vars.S3_BUCKET_DEV }}
        run: |
          CURRENT=$(aws s3 cp "s3://$BUCKET/.project-owner" - 2>/dev/null || echo "")
          if [ "$CURRENT" != "html-wapi" ]; then
            echo "❌ El bucket $BUCKET pertenece a '${CURRENT:-(sin marker)}', no a 'html-wapi'."; exit 1; fi
          echo "✅ Bucket validado."

      - name: Subir assets y HTML
        env:
          BUCKET: ${{ vars.S3_BUCKET_DEV }}
        run: |
          # Primero los assets nuevos (sin borrar los viejos), después el HTML que los usa. Los viejos
          # se borran recién en el último paso, cuando ningún HTML en caché los pide.
          # JS, CSS, fuentes y videos de Vite llevan hash en el nombre: caché de un año.
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --exclude "images/*" \
            --cache-control "public, max-age=31536000, immutable"
          # El resto (HTML de cada ruta, imágenes públicas, robots, sitemap). El navegador revalida
          # siempre (max-age=0); CloudFront lo guarda un día (s-maxage) y cada deploy lo invalida.
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --exclude "assets/*" --include "assets/images/*" \
            --exclude ".project-owner" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Invalidar CloudFront y esperar
        env:
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_DEV }}
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text)
          echo "Invalidación $ID"
          # Hay que esperarla: con el HTML guardado en CloudFront, borrar los assets viejos antes de
          # que termine dejaría páginas en caché pidiendo archivos que ya no existen.
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$ID"
          echo "### DEV: ${{ vars.SITE_URL_DEV }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Borrar los assets viejos
        env:
          BUCKET: ${{ vars.S3_BUCKET_DEV }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete \
            --exclude "images/*" \
            --cache-control "public, max-age=31536000, immutable"
