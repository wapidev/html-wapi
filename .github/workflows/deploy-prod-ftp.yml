name: Deploy PROD (FTP)

# ============================================================================
# Sitio Wapi → PRODUCCIÓN (wapidesign.com) por FTP al hosting Apache (HostGator).
# Mismo esquema que el front de WG013 (deploy-prod-ftp.yml).
#
# Se dispara con cada push a `main`. El flujo de ramas es feature → develop → main:
# mergear a develop NO publica nada; publicar es mergear develop a main.
#
# Qué versión sale la decide el feature flag de .env.production (VITE_SITIO_NUEVO).
# Este workflow NO lo pisa a propósito: lanzar el sitio nuevo es un cambio de código
# (un PR que pasa ese valor a true), no una variable escondida en GitHub.
#
# Cargar en el repo (Settings → Secrets and variables → Actions):
#   Secrets:
#     FTP_SERVER          host FTP (ej. ftp.wapidesign.com)
#     FTP_USERNAME        usuario FTP
#     FTP_PASSWORD        contraseña FTP
#   Variables:
#     FTP_REMOTE_DIR      raíz web del dominio (ej. public_html/) — obligatoria
#     FTP_SSL             'true' = FTPS (TLS) · 'false' = FTP plano — default: true
#     FTP_SSL_VERIFY      'no' solo si el hosting usa un certificado autofirmado — default: yes
# ============================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-ftp
  cancel-in-progress: true

# contents: write para poder crear el tag y el release del deploy.
permissions:
  contents: write

jobs:
  build-and-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # Reinstalar fresh: el lockfile generado en macOS no trae los binarios nativos
        # opcionales (lightningcss, @tailwindcss/oxide, rolldown) para Linux.
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Guardas de configuración
        # Fallar temprano y claro si falta config, antes de buildear/subir. Los secrets entran
        # por env y no interpolados en el script: una contraseña con comillas o $ lo rompería.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "❌ Faltan secrets FTP (FTP_SERVER / FTP_USERNAME / FTP_PASSWORD)."; exit 1; fi
          # Sin default a propósito: con la cuenta FTP principal de cPanel la raíz es el home,
          # no public_html, y el sitio quedaría subido donde nadie lo ve.
          if [ -z "$FTP_REMOTE_DIR" ]; then
            echo "❌ Falta la variable FTP_REMOTE_DIR (raíz web del dominio, ej. public_html/)."; exit 1; fi

      - name: Tests
        run: npm run test -- --run

      - name: Build (Vite + prerender)
        run: npm run build

      - name: Verificar artefactos críticos
        # Sin .htaccess no hay redirección a HTTPS ni 404 propia; sin 404.html, Apache
        # muestra su página de error genérica.
        run: |
          for f in .htaccess index.html 404.html sitemap.xml robots.txt; do
            test -f "dist/$f" || { echo "❌ falta dist/$f"; exit 1; }
          done
          if grep -q 'Diseño Web Profesional' dist/index.html; then
            VERSION='página "en desarrollo" (VITE_SITIO_NUEVO=false)'
          else
            VERSION='sitio nuevo (VITE_SITIO_NUEVO=true)'
          fi
          echo "✅ dist/ ok ($(find dist -type f | wc -l) archivos) — se publica: $VERSION"
          echo "### Se publica: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir dist/ por FTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_SSL: ${{ vars.FTP_SSL }}
          FTP_SSL_VERIFY: ${{ vars.FTP_SSL_VERIFY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          SSL="${FTP_SSL:-true}"
          # Verificar el certificado del servidor es el default: FTPS sin validar identidad
          # deja las credenciales a merced de un man-in-the-middle. Si el hosting usa un
          # certificado autofirmado el deploy falla acá; FTP_SSL_VERIFY=no es un parche.
          SSL_VERIFY="${FTP_SSL_VERIFY:-yes}"
          # La contraseña va por LFTP_PASSWORD (--env-password): no queda en la línea de
          # comandos ni se re-parsea dentro del script de lftp.
          export LFTP_PASSWORD="$FTP_PASSWORD"
          # mirror -R = subir. Incluye dotfiles (.htaccess). Sin --delete para no borrar
          # contenido ajeno de la raíz web; los assets llevan hash y conviven sin pisarse.
          lftp -c "
            set ftp:ssl-allow $SSL;
            set ftp:ssl-force $SSL;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate $SSL_VERIFY;
            set net:max-retries 2;
            set net:timeout 20;
            open --env-password -u '$FTP_USERNAME' '$FTP_SERVER';
            mirror -R --verbose --exclude-glob .git* ./dist/ '$FTP_REMOTE_DIR';
          "
          echo "✅ Subida FTP completa a '$FTP_REMOTE_DIR'."

      # Deja una marca de que ESTE commit es el que está en producción, para poder volver
      # atrás sin buscar el SHA a mano. Fecha + número de run: ordena solo y no se repite.
      - name: Etiquetar la versión desplegada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="v$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          git tag -a "$VERSION" -m "Desplegado a produccion el $(date -u +'%F %T') UTC"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes
