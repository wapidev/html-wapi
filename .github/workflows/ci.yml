name: CI

# Gate de calidad del sitio. Corre en PRs hacia develop/main y en cualquier push.
# Buildea las dos versiones del feature flag:
#   - apagado (lo que se publica hoy): verifica que dist/ no traiga nada del sitio nuevo;
#   - encendido (el sitio nuevo): verifica que estén todas las rutas prerenderizadas.
on:
  pull_request:
    branches: [develop, main]
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Mismo workaround que el front de WG013: el lockfile se genera en macOS y no trae los
      # binarios nativos opcionales (lightningcss, @tailwindcss/oxide, rolldown) para Linux.
      - name: Instalar dependencias
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test -- --run

      - name: Build con el flag apagado (página "en desarrollo")
        run: npm run build

      - name: Sin contenido del sitio nuevo publicado
        run: |
          if grep -rIl -i "gemmia\|desapercibidas\|Hagamos algo" dist; then
            echo "❌ dist/ trae contenido del sitio nuevo con el flag apagado"; exit 1; fi
          test -f dist/index.html && test -f dist/404.html && test -f dist/.htaccess
          echo "✅ dist/ solo tiene la página en desarrollo"

      - name: Build con el flag encendido (sitio nuevo)
        run: npm run build
        env:
          VITE_SITIO_NUEVO: 'true'

      - name: Rutas prerenderizadas
        run: |
          for f in index.html 404.html trabajos/index.html trabajos/gemmia-logistics/index.html \
                   trabajos/gestion-de-prestamos/index.html trabajos/ida-y-vuelta-ibiza/index.html \
                   trabajos/cliente-04/index.html sitemap.xml robots.txt .htaccess; do
            test -f "dist/$f" || { echo "❌ falta dist/$f"; exit 1; }
          done
          grep -q "Marcas" dist/index.html || { echo "❌ la Home no viene prerenderizada"; exit 1; }
          echo "✅ sitio nuevo completo"
